# check: the first of the two blocking gates (P-two-gates). Runs make check, identical to local.
# Copied from the kit's template (ert485/xenia-2026, templates/workflows/check.yml) plus a Node 26
# setup step, because this project pins Node 26 and the frontend's .npmrc is engine-strict.
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (default rules plus the LiteLLM sk- rule)
        # The gitleaks GitHub Action demands a paid licence key on organisation accounts; the CLI
        # in the project's own container image does not, and scans the same history with the
        # same rules.
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest
          detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: make check
        run: make check
