[[question]]
text = "**Does a goal belong to the whole balance or to a tag?** The whole balance matches today's forecast and is simplest; a tag such as Savings means money has to be set aside for it."

[[question]]
text = "**When a check-in differs from the forecast, should kriket guess why?** (“Groceries cost $30 more than usual this month.”) Proposed for a later iteration: only the difference for now, no guessing."

[[question]]
text = "**Statement import: when, and what is kept?** Open; the plan file stands with its four decisions (scope, retention, timing, statement or paystub first) unanswered until this iteration is reviewed."
