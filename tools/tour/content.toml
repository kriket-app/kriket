# ---------------------------------------------------------------- what you can do today

[[built]]
item = 0
title = "Tags"
text = "Four presets on first visit: Pay cheque and Side hustle for money in, Bill and Groceries for money out. Any colour from a styled picker (swatches, a hue slider, a hex field); rename or delete leaves a tag's streams untagged instead of breaking them. Each tag has its own page listing every stream that carries it."

[[built]]
item = 1
title = "Income and expense streams"
text = "Add, edit, and delete money on a rhythm: a name, the usual amount, how often (Weekly, Every 2 weeks, Monthly, or every N days), a next date from a styled calendar, and an optional tag. \"Add a range\" folds open a minimum and maximum when a stream is not fixed. Expense amounts are expense-orange everywhere."

[[built]]
item = 2
title = "The balance check-in"
text = "The first thing on the overview: type today's balance and Save, and a \"Saved\" line confirms it while the forecast redraws. Every check-in is kept; the balances page flips through them, redraws the forecast from any of them, and says how each compared with what the previous one expected."

[[built]]
item = 3
title = "The overview"
text = "A sentence answers \"am I going to be OK?\" first (\"You go $255 short on Oct 2. You are under zero from Oct 2 until Oct 11.\"), then the chart: a dot per payment, the band from worst to best case, the time under zero shaded expense-orange. Three small tiles below hold the lowest point, the expected end balance, and the worst-to-best range. Coming up lists the month's payments by day, with a switcher to flip months and a \"Today\" divider."

[also]
text = "Also working: sign up, sign in, and sign out, with every `/app` page behind sign-in; the landing page, updated for this iteration; a top bar on desktop and a bottom tab bar on phones; an install manifest for the phone app."

