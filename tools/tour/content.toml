# Everything the tour page says lives here. build-tour.py turns it into kriket-app-tour.html.
#
# Text fields are markdown-ish: `code`, **bold**, [label](https://...), blank line = new paragraph,
# lines starting with "- " = a bullet list. Everything else is plain text.
#
# After a new iteration of the app:
#   1. add an [[iteration]] block at the top of the iterations list (newest first on the page),
#   2. update [meta] as_built / branch / commit,
#   3. tick items off in [[built]] and remove them from [[next]] as they ship,
#   4. adjust any stop caption that no longer matches its screenshot.

