<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#16a34a" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#242424" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Kriket" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/Kriket180x180.png" />
		<script>
			// Apply the stored colour theme before first paint so the app never
			// flashes the wrong mode. Mirrors src/lib/theme.svelte.ts.
			try {
				var kriketTheme = localStorage.getItem('kriket-theme') || 'system';
				if (
					kriketTheme === 'dark' ||
					(kriketTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
				) {
					document.documentElement.classList.add('dark');
				}
			} catch (e) {
				/* Storage unavailable: fall back to the light theme. */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
